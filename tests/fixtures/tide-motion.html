<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>海岸观察手记</title><style>
*{box-sizing:border-box}body{margin:0;background:#102e35;color:#f3eddb;font:2.3vmin system-ui,sans-serif}main{height:100vh;padding:6vh 6vw;display:grid;grid-template-rows:auto 1fr auto;gap:3vh}header,footer{display:flex;align-items:center;justify-content:space-between}header{border-bottom:1px solid #78968c;padding-bottom:2vh;letter-spacing:.12em}.hero{display:grid;grid-template-columns:42% 58%;align-items:center}.label{color:#ffc872;font:2.6vmin monospace}h1{font: bold 9.4vmin/1.1 serif;margin:.25em 0}p{max-width:24em;line-height:1.65}.chart{position:relative;background:#19434a;height:50vh;border:1px solid #64867f;overflow:hidden}.chart svg{width:100%;height:100%}.chart h2{position:absolute;top:2%;left:5%;font-size:2.4vmin;font-weight:500}.chart p{position:absolute;bottom:0;left:5%;font-size:1.75vmin}.dot,.marker{position:absolute;left:5%;width:4%;height:7%;border-radius:50%}.dot{top:20%;background:#ff8e48;animation:ride 2s linear infinite alternate}.marker{top:80%;background:#40e7a9}@keyframes ride{to{left:90%}}footer{border-top:1px solid #78968c;padding-top:1vh;font:2vmin monospace}
</style></head><body><main><header><span>岸线观察室</span><span>COASTAL OBSERVATORY</span></header><section class="hero"><div><span class="label">FIELD NOTES / 06</span><h1>海岸<br>观察手记</h1><p>跟随两个光点，观察海面随时间的变化。</p></div><div class="chart"><svg viewBox="0 0 500 260" preserveAspectRatio="none" aria-label="潮水剖面"><path fill="#26747a" d="M0 150 Q100 75 200 146 T400 140 T540 130 V260 H0Z"/><path fill="#389290" d="M0 200 Q85 132 182 184 T386 189 T530 175 V260 H0Z"/></svg><h2>潮线与观测点</h2><p>橙点和绿点分别标记两条观测轨迹。</p><i class="dot"></i><i class="marker"></i></div></section><footer><span>潮汐观测 · 示意动画</span><span>CSS / RAF</span></footer></main><script>
const origin=performance.now();function move(t){document.querySelector('.marker').style.left=(5+85*(1-Math.abs(((t-origin)%4000)/2000-1)))+'%';requestAnimationFrame(move)}requestAnimationFrame(move)
</script></body></html>
